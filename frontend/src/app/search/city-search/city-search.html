<mat-form-field class="search">
  <mat-label>Search city</mat-label>
  <input matInput #cityInput (input)="search(cityInput.value)" [matAutocomplete]="auto" />
  @if (loading()) {
    <mat-spinner matSuffix diameter="20" />
  }
  <mat-autocomplete #auto="matAutocomplete" (optionSelected)="selectCity($event.option.value, cityInput)">
    @if (cityResults(); as cr) {
      @for (city of cr; track city.id) {
        <mat-option [value]="city">
          {{ city.name }}, @if (city.admin1) { {{ city.admin1 }}, }{{ city.country }}
        </mat-option>
      } @empty {
        <mat-option disabled>No results found</mat-option>
      }
    }
  </mat-autocomplete>
</mat-form-field>

@if (errorMessage(); as em) {
  <p class="server-error">{{ em }}</p>
}
