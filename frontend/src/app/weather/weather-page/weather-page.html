<main class="content">
  <app-city-search (citySelected)="onCitySelected($event)"></app-city-search>
  @if (weatherData(); as wd) {
    <mat-card>
      <mat-card-header>
        <mat-card-title>{{ selectedCity()?.name }}, {{ selectedCity()?.country }}</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div>
          <span class="temperature">Temperature: {{ wd.current.temperature_2m }} °C</span>
        </div>
        <div>
          <span>Rain: {{ wd.current.rain }} mm</span>
        </div>
      </mat-card-content>
      <mat-card-actions>
        <button matButton (click)="addToFavorites()" [disabled]="isFavorite()">
          {{ isFavorite() ? 'In favorites' : 'Add to favorites' }}
        </button>
      </mat-card-actions>
      @if (errorMessage(); as em) {
        <p class="server-error">{{ em }}</p>
      }
    </mat-card>
  } @else if (errorMessage(); as em) {
    <p>{{ em }}</p>
  } @else {
    <mat-spinner diameter="40" />
  }
  <app-favorite-list (citySelected)="onCitySelected($event)" />
</main>
