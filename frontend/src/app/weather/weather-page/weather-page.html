<app-header />
<app-city-search (citySelected)="onCitySelected($event)"></app-city-search>
@if (weatherData(); as wd) {
  <p>Temperature: {{wd.current.temperature_2m}} Celsius</p>
  <p>Rain: {{wd.current.rain}} mm</p>
} @else if (errorMessage(); as em){
  <p>{{em}}</p>
} @else {
  <p>Loading...</p>
}
<app-favorite-list></app-favorite-list>
